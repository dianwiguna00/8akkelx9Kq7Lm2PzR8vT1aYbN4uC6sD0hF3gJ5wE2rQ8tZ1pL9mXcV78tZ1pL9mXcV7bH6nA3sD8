<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Matematika</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
margin:0;
text-align:center;
}

.container{
max-width:950px;
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.timer{
font-size:24px;
font-weight:bold;
color:#d9534f;
margin-bottom:10px;
}

.score-board{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.team{
padding:12px;
background:#f0f0f0;
border-radius:10px;
font-size:18px;
}

.active{
background:#c8f7c5;
font-weight:bold;
}

.question{
  font-size:24px;
  text-align:left;
  margin:10px 0;
  white-space: pre-line;
}

.options{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.optionBtn{
padding:15px;
font-size:20px;
border:none;
border-radius:12px;
cursor:pointer;
color:white;
font-weight:bold;
}

.btnA{background:#1E88E5;}
.btnB{background:#43A047;}
.btnC{background:#FB8C00;}
.btnD{background:#8E24AA;}

.correct{background:#2ecc71!important;}
.wrong{background:#e74c3c!important;}

button{
margin:5px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#4CAF50;
color:white;
font-size:16px;
cursor:pointer;
}

.feedback{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.pembahasan{
display:none;
margin-top:15px;
padding:15px;
background:#f9fbff;
border-left:5px solid #2196F3;
text-align:left;
border-radius:10px;
}
.close{
float:right;
cursor:pointer;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>🎮 Kuis Matematika</h1>
<h3>Menyelesaikan Masalah Kontekstual Pola Bilangan</h3>

<div class="timer" id="timer">Waktu: 60:00</div>

<div class="score-board">
<div id="team1" class="team active"></div>
<div id="team2" class="team"></div>
<div id="team3" class="team"></div>
<div id="team4" class="team"></div>
</div>

<div id="questionNumber"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>

<button onclick="nextQuestion()">Soal Berikut</button>
<button onclick="switchTeam()">Ganti Regu</button>
<button onclick="showPembahasan()">📘 Pembahasan</button>

<div id="feedback" class="feedback"></div>

<div id="pembahasan" class="pembahasan">
<span class="close" onclick="closePembahasan()">✖</span>
<b>Pembahasan</b>
<div id="pembahasanText"></div>
</div>
</div>

<script>
let questions=[
{
q:"Sebuah taman memiliki barisan pohon yang ditanam setiap tahun. Tahun pertama: 7 pohon, tahun kedua: 11 pohon, tahun ketiga: 15 pohon, dan seterusnya. Berapa jumlah pohon yang ditanam pada tahun ke-8?",
options:["31","35","39","43"],
correct:"35",
p:"Jumlah pohon membentuk pola aritmetika dengan suku pertama a = 7 dan beda d = 4. Rumus suku ke-n adalah Un = a + (n - 1)d. Untuk tahun ke-8: U8 = 7 + (8 - 1)×4 = 7 + 28 = 35. Kunci jawaban yang benar adalah 35.",
img:""
},
{
q:"Seorang siswa menabung setiap minggu dengan pola: Rp4.000, Rp7.000, Rp10.000, Rp13.000, ... Berapa total tabungan selama 10 minggu?",
options:["Rp85.000","Rp95.000","Rp100.000","Rp175.000"],
correct:"Rp175.000",
p:"Tabungan mingguan membentuk pola aritmetika dengan suku pertama a = 4.000 dan beda d = 3.000. Suku ke-10 adalah U10 = 4.000 + 9×3.000 = 31.000. Jumlah 10 minggu adalah Sn = n/2 × (a + Un) = 10/2 × (4.000 + 31.000) = 5 × 35.000 = 175.000.",
img:""
},
{
q:"Sebuah gedung memiliki jendela yang disusun bertingkat: Lantai 1: 6 jendela, Lantai 2: 10 jendela, Lantai 3: 14 jendela, dan seterusnya. Berapa jumlah jendela di lantai ke-12?",
options:["46","50","54","58"],
correct:"50",
p:"Jumlah jendela per lantai membentuk pola aritmetika dengan a = 6 dan d = 4. Rumus suku ke-n adalah Un = a + (n - 1)d. Lantai ke-12: U12 = 6 + 11×4 = 6 + 44 = 50. Jadi, jawaban yang benar adalah 50.",
img:""
},
{
q:"Dalam sebuah acara, kursi disusun dalam barisan: Baris 1: 8 kursi, Baris 2: 12 kursi, Baris 3: 16 kursi, dan seterusnya. Jika ada 15 baris, berapa total kursi seluruh baris?",
options:["360","400","420","540"],
correct:"540",
p:"Jumlah kursi per baris membentuk pola aritmetika dengan a = 8 dan d = 4. Suku ke-15 adalah U15 = 8 + 14×4 = 64. Jumlah seluruh kursi adalah Sn = 15/2 × (8 + 64) = 7,5 × 72 = 540.",
img:""
},
{
q:"Seorang petani menanam tanaman dalam barisan: Baris 1: 2 tanaman, Baris 2: 5 tanaman, Baris 3: 8 tanaman, dan seterusnya. Berapa banyak tanaman pada baris ke-20?",
options:["56","59","60","62"],
correct:"59",
p:"Banyak tanaman membentuk pola aritmetika dengan suku pertama a = 2 dan beda d = 3. Rumus suku ke-n adalah Un = a + (n - 1)d. Baris ke-20: U20 = 2 + 19×3 = 59.",
img:""
}

];

let currentQuestion=0;
let scores=[0,0,0,0];
let wrongs=[0,0,0,0];
let currentTeam=0;
let answered=new Array(questions.length).fill(false);
let quizFinished=false;

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}}

function showQuestion(){
if(quizFinished) return;

let q=questions[currentQuestion];
let opsi=[...q.options];
shuffle(opsi);

q.correctIndex=opsi.indexOf(q.correct);
q.correctLetter=String.fromCharCode(65+q.correctIndex);

document.getElementById("question").textContent=q.q;
document.getElementById("questionNumber").textContent=
`Soal ${currentQuestion+1} dari ${questions.length}`;

let html="";
opsi.forEach((o,i)=>{
let letter=String.fromCharCode(65+i);
let btnClass=["btnA","btnB","btnC","btnD"][i];
html+=`<button class="optionBtn ${btnClass}"
onclick="checkAnswer('${letter}','${o}',this)">
${letter}. ${o}</button>`;
});
document.getElementById("options").innerHTML=html;
document.getElementById("feedback").textContent="";
closePembahasan();
}

function checkAnswer(letter,text,btn){
if(quizFinished) return;

let q=questions[currentQuestion];
document.querySelectorAll(".optionBtn").forEach(b=>b.disabled=true);

if(text===q.correct){
btn.classList.add("correct");
scores[currentTeam]++;
answered[currentQuestion]=true;
document.getElementById("feedback").textContent="✅ Benar";
}else{
btn.classList.add("wrong");
wrongs[currentTeam]++;
document.getElementById("feedback").textContent="❌ Salah";
}

updateScore();

setTimeout(()=>{
if(answered.every(v=>v)){
endQuiz();
}else nextQuestion();
},800);
}

function nextQuestion(){
let start=currentQuestion;
do{
currentQuestion=(currentQuestion+1)%questions.length;
}while(answered[currentQuestion] && currentQuestion!==start);
showQuestion();
}

function endQuiz(){
quizFinished=true;
clearInterval(timer);
document.getElementById("question").innerHTML="🏁 <b>KUIS SELESAI</b>";
document.getElementById("options").innerHTML="";
document.getElementById("feedback").innerHTML=showWinners();
}

function showWinners(){
let rank=[0,1,2,3].map(i=>({
team:i+1,
score:scores[i]-wrongs[i]
}));
rank.sort((a,b)=>b.score-a.score);

let html="<h2>🏆 Pengumuman Juara</h2>";
rank.forEach((r,i)=>{
html+=`<p>Juara ${i+1}: <b>Regu ${r.team}</b> (Skor ${r.score})</p>`;
});
return html;
}

function updateScore(){
for(let i=0;i<4;i++){
document.getElementById("team"+(i+1)).textContent=
`Regu ${i+1} | Benar: ${scores[i]} | Salah: ${wrongs[i]} | Skor: ${scores[i]-wrongs[i]}`;
}}

function switchTeam(){
document.getElementById("team"+(currentTeam+1)).classList.remove("active");
currentTeam=(currentTeam+1)%4;
document.getElementById("team"+(currentTeam+1)).classList.add("active");
}

function showPembahasan(){
document.getElementById("pembahasanText").textContent=
questions[currentQuestion].p;
document.getElementById("pembahasan").style.display="block";
}

function closePembahasan(){
document.getElementById("pembahasan").style.display="none";
}

let timeLeft=3600;
let timer=setInterval(()=>{
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
if(s<10)s="0"+s;
document.getElementById("timer").textContent=`Waktu: ${m}:${s}`;
timeLeft--;
if(timeLeft<0){
document.getElementById("timer").textContent="⏰ Waktu Habis";
endQuiz();
}},1000);

shuffle(questions);
updateScore();
showQuestion();
</script>

<h3>Dian Wiguna</h3>
</body>
</html>
