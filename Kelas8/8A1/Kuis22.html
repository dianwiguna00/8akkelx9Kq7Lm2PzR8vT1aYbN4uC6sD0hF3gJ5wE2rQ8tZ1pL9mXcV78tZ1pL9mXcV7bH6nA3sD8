<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Matematika</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
margin:0;
text-align:center;
}

.container{
max-width:950px;
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.timer{
font-size:24px;
font-weight:bold;
color:#d9534f;
margin-bottom:10px;
}

.score-board{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.team{
padding:12px;
background:#f0f0f0;
border-radius:10px;
font-size:18px;
}

.active{
background:#c8f7c5;
font-weight:bold;
}

.question{
  font-size:24px;
  text-align:left;
  margin:10px 0;
  white-space: pre-line;
}

.options{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.optionBtn{
padding:15px;
font-size:20px;
border:none;
border-radius:12px;
cursor:pointer;
color:white;
font-weight:bold;
}

.btnA{background:#1E88E5;}
.btnB{background:#43A047;}
.btnC{background:#FB8C00;}
.btnD{background:#8E24AA;}

.correct{background:#2ecc71!important;}
.wrong{background:#e74c3c!important;}

button{
margin:5px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#4CAF50;
color:white;
font-size:16px;
cursor:pointer;
}

.feedback{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.pembahasan{
display:none;
margin-top:15px;
padding:15px;
background:#f9fbff;
border-left:5px solid #2196F3;
text-align:left;
border-radius:10px;
}
.close{
float:right;
cursor:pointer;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>🎮 Kuis Matematika</h1>
<h3>Masalah Keuangan Sederhana dengan SPLDV</h3>

<div class="timer" id="timer">Waktu: 60:00</div>

<div class="score-board">
<div id="team1" class="team active"></div>
<div id="team2" class="team"></div>
<div id="team3" class="team"></div>
<div id="team4" class="team"></div>
</div>

<div id="questionNumber"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>

<button onclick="nextQuestion()">Soal Berikut</button>
<button onclick="switchTeam()">Ganti Regu</button>
<button onclick="showPembahasan()">📘 Pembahasan</button>

<div id="feedback" class="feedback"></div>

<div id="pembahasan" class="pembahasan">
<span class="close" onclick="closePembahasan()">✖</span>
<b>Pembahasan</b>
<div id="pembahasanText"></div>
</div>
</div>

<script>
let questions=[
{
q:"Seorang ibu membeli 3 kg beras dan 2 liter minyak goreng seharga Rp76.000. Temannya membeli 2 kg beras dan 4 liter minyak goreng seharga Rp88.000. Berapakah harga per kg beras dan per liter minyak goreng?",
options:["Rp16.000 dan Rp14.000","Rp14.000 dan Rp16.000","Rp15.000 dan Rp13.000","Rp13.000 dan Rp15.000"],
correct:"Rp16.000 dan Rp14.000",
p:"Misalkan x harga beras per kg dan y harga minyak per liter. Dari soal diperoleh sistem persamaan 3x + 2y = 76000 dan 2x + 4y = 88000. Dengan eliminasi diperoleh x = 16000 dan y = 14000. Jadi harga beras Rp16.000 per kg dan minyak Rp14.000 per liter.",
img:""
},
{
q:"Paket makanan terdiri dari nasi dan ayam. Paket A: 2 nasi dan 1 ayam = Rp25.000. Paket B: 1 nasi dan 2 ayam = Rp30.000. Berapakah harga nasi dan ayam?",
options:["Rp10.000 dan Rp5.000","Rp5.000 dan Rp10.000","Rp15.000 dan Rp10.000","Rp20000/3 dan Rp35000/3"],
correct:"Rp20000/3 dan Rp35000/3",
p:"Misalkan x harga nasi dan y harga ayam. Diperoleh SPLDV 2x + y = 25000 dan x + 2y = 30000. Dengan eliminasi diperoleh x = 20000/3 dan y = 35000/3.",
img:""
},
{
q:"Seorang siswa membeli 4 buku dan 3 pensil seharga Rp43.000. Temannya membeli 2 buku dan 5 pensil seharga Rp41.000. Berapakah harga sebuah buku dan sebuah pensil?",
options:["Rp8.000 dan Rp3.000","Rp9.000 dan Rp5.000","Rp7.000 dan Rp4.000","Rp46.000/7 dan Rp39.000/7"],
correct:"Rp46.000/7 dan Rp39.000/7",
p:"Misalkan x harga buku dan y harga pensil. Diperoleh SPLDV 4x + 3y = 43000 dan 2x + 5y = 41000. Dengan eliminasi diperoleh y = 39.000/7 dan x = 46.000/7..",
img:""
},
{
q:"Dalam sebuah toko, 5 kg gula dan 2 liter susu seharga Rp70.000. Sedangkan 3 kg gula dan 4 liter susu seharga Rp72.000. Berapakah harga gula per kg dan susu per liter?",
options:["Rp10.000 dan Rp15.000","Rp12.000 dan Rp14.000","Rp11.000 dan Rp13.000","Rp68000/7 dan Rp75000/7"],
correct:"Rp68000/7 dan Rp75000/7",
p:"Misalkan x harga gula per kg dan y harga susu per liter. Diperoleh SPLDV 5x + 2y = 70000 dan 3x + 4y = 72000. Dengan eliminasi diperoleh x = 68000/7 dan y = 75000/7.",
img:""
},
{
q:"Seorang pelanggan membeli 2 roti dan 3 kue seharga Rp29.000. Pelanggan lain membeli 4 roti dan 1 kue seharga Rp27.000. Berapakah harga sebuah roti dan sebuah kue?",
options:["Rp5.200 dan Rp6.200","Rp5.000 dan Rp6.000","Rp4.000 dan Rp7.000","Rp7.000 dan Rp4.000"],
correct:"Rp5.200 dan Rp6.200",
p:"Misalkan x harga roti dan y harga kue. Dari soal diperoleh SPLDV 2x + 3y = 29000 dan 4x + y = 27000. Dengan substitusi diperoleh x = 5.200 dan y = 6.200.",
img:""
}

];

let currentQuestion=0;
let scores=[0,0,0,0];
let wrongs=[0,0,0,0];
let currentTeam=0;
let answered=new Array(questions.length).fill(false);
let quizFinished=false;

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}}

function showQuestion(){
if(quizFinished) return;

let q=questions[currentQuestion];
let opsi=[...q.options];
shuffle(opsi);

q.correctIndex=opsi.indexOf(q.correct);
q.correctLetter=String.fromCharCode(65+q.correctIndex);

document.getElementById("question").textContent=q.q;
document.getElementById("questionNumber").textContent=
`Soal ${currentQuestion+1} dari ${questions.length}`;

let html="";
opsi.forEach((o,i)=>{
let letter=String.fromCharCode(65+i);
let btnClass=["btnA","btnB","btnC","btnD"][i];
html+=`<button class="optionBtn ${btnClass}"
onclick="checkAnswer('${letter}','${o}',this)">
${letter}. ${o}</button>`;
});
document.getElementById("options").innerHTML=html;
document.getElementById("feedback").textContent="";
closePembahasan();
}

function checkAnswer(letter,text,btn){
if(quizFinished) return;

let q=questions[currentQuestion];
document.querySelectorAll(".optionBtn").forEach(b=>b.disabled=true);

if(text===q.correct){
btn.classList.add("correct");
scores[currentTeam]++;
answered[currentQuestion]=true;
document.getElementById("feedback").textContent="✅ Benar";
}else{
btn.classList.add("wrong");
wrongs[currentTeam]++;
document.getElementById("feedback").textContent="❌ Salah";
}

updateScore();

setTimeout(()=>{
if(answered.every(v=>v)){
endQuiz();
}else nextQuestion();
},800);
}

function nextQuestion(){
let start=currentQuestion;
do{
currentQuestion=(currentQuestion+1)%questions.length;
}while(answered[currentQuestion] && currentQuestion!==start);
showQuestion();
}

function endQuiz(){
quizFinished=true;
clearInterval(timer);
document.getElementById("question").innerHTML="🏁 <b>KUIS SELESAI</b>";
document.getElementById("options").innerHTML="";
document.getElementById("feedback").innerHTML=showWinners();
}

function showWinners(){
let rank=[0,1,2,3].map(i=>({
team:i+1,
score:scores[i]-wrongs[i]
}));
rank.sort((a,b)=>b.score-a.score);

let html="<h2>🏆 Pengumuman Juara</h2>";
rank.forEach((r,i)=>{
html+=`<p>Juara ${i+1}: <b>Regu ${r.team}</b> (Skor ${r.score})</p>`;
});
return html;
}

function updateScore(){
for(let i=0;i<4;i++){
document.getElementById("team"+(i+1)).textContent=
`Regu ${i+1} | Benar: ${scores[i]} | Salah: ${wrongs[i]} | Skor: ${scores[i]-wrongs[i]}`;
}}

function switchTeam(){
document.getElementById("team"+(currentTeam+1)).classList.remove("active");
currentTeam=(currentTeam+1)%4;
document.getElementById("team"+(currentTeam+1)).classList.add("active");
}

function showPembahasan(){
document.getElementById("pembahasanText").textContent=
questions[currentQuestion].p;
document.getElementById("pembahasan").style.display="block";
}

function closePembahasan(){
document.getElementById("pembahasan").style.display="none";
}

let timeLeft=3600;
let timer=setInterval(()=>{
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
if(s<10)s="0"+s;
document.getElementById("timer").textContent=`Waktu: ${m}:${s}`;
timeLeft--;
if(timeLeft<0){
document.getElementById("timer").textContent="⏰ Waktu Habis";
endQuiz();
}},1000);

shuffle(questions);
updateScore();
showQuestion();
</script>


</body>
</html>
