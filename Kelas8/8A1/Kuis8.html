<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Matematika</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
margin:0;
text-align:center;
}

.container{
max-width:950px;
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.timer{
font-size:24px;
font-weight:bold;
color:#d9534f;
margin-bottom:10px;
}

.score-board{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.team{
padding:12px;
background:#f0f0f0;
border-radius:10px;
font-size:18px;
}

.active{
background:#c8f7c5;
font-weight:bold;
}

.question{
  font-size:24px;
  text-align:left;
  margin:10px 0;
  white-space: pre-line;
}

.options{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.optionBtn{
padding:15px;
font-size:20px;
border:none;
border-radius:12px;
cursor:pointer;
color:white;
font-weight:bold;
}

.btnA{background:#1E88E5;}
.btnB{background:#43A047;}
.btnC{background:#FB8C00;}
.btnD{background:#8E24AA;}

.correct{background:#2ecc71!important;}
.wrong{background:#e74c3c!important;}

button{
margin:5px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#4CAF50;
color:white;
font-size:16px;
cursor:pointer;
}

.feedback{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.pembahasan{
display:none;
margin-top:15px;
padding:15px;
background:#f9fbff;
border-left:5px solid #2196F3;
text-align:left;
border-radius:10px;
}
.close{
float:right;
cursor:pointer;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>🎮 Kuis Matematika</h1>
<h3>Menyajikan Relasi dan Fungsi dalam Bentuk Diagram Panah, Tabel, dan Grafik</h3>

<div class="timer" id="timer">Waktu: 60:00</div>

<div class="score-board">
<div id="team1" class="team active"></div>
<div id="team2" class="team"></div>
<div id="team3" class="team"></div>
<div id="team4" class="team"></div>
</div>

<div id="questionNumber"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>

<button onclick="nextQuestion()">Soal Berikut</button>
<button onclick="switchTeam()">Ganti Regu</button>
<button onclick="showPembahasan()">📘 Pembahasan</button>

<div id="feedback" class="feedback"></div>

<div id="pembahasan" class="pembahasan">
<span class="close" onclick="closePembahasan()">✖</span>
<b>Pembahasan</b>
<div id="pembahasanText"></div>
</div>
</div>

<script>
let questions=[
{
q:"Diberikan fungsi f(x) = x + 2 dengan domain {1, 2, 3}. Manakah pasangan yang benar dalam bentuk tabel?",
options:["x: 1, 2, 3 | f(x): 2, 3, 4","x: 1, 2, 3 | f(x): 3, 4, 5","x: 1, 2, 3 | f(x): 4, 5, 6","x: 1, 2, 3 | f(x): 5, 6, 7"],
correct:"x: 1, 2, 3 | f(x): 3, 4, 5",
p:"Diketahui f(x) = x + 2. Maka f(1) = 3, f(2) = 4, dan f(3) = 5. Pasangan yang benar adalah (1,3), (2,4), dan (3,5).",
img:""
},
{
q:"Fungsi f(x) = 2x - 1 dengan domain {-1, 0, 1}. Titik grafik yang benar adalah ...",
options:["(-1, -3), (0, -1), (1, 1)","(-1, -1), (0, 0), (1, 1)","(-1, 1), (0, 0), (1, -1)","(-1, -2), (0, -1), (1, 0)"],
correct:"(-1, -3), (0, -1), (1, 1)",
p:"Dengan f(x) = 2x - 1 diperoleh f(-1) = -3, f(0) = -1, dan f(1) = 1. Titik-titik ini sesuai dengan grafik fungsi.",
img:""
},
{
q:"Dalam diagram panah, fungsi f(x) = 3x dengan domain {1, 2, 3} akan memiliki panah dari 1 ke ..., 2 ke ..., dan 3 ke ...",
options:["3, 6, 9","2, 4, 6","1, 2, 3","4, 5, 6"],
correct:"3, 6, 9",
p:"Dengan f(x) = 3x maka f(1) = 3, f(2) = 6, dan f(3) = 9. Diagram panah menunjukkan pemetaan tersebut.",
img:""
},
{
q:"Fungsi f(x) = x² dengan domain {-2, -1, 0, 1, 2}. Manakah titik grafik yang benar?",
options:["(-2, 4), (-1, 1), (0, 0), (1, 1), (2, 4)","(-2, -4), (-1, -1), (0, 0), (1, 1), (2, 2)","(-2, 2), (-1, 1), (0, 0), (1, 1), (2, 2)","(-2, 0), (-1, 0), (0, 0), (1, 0), (2, 0)"],
correct:"(-2, 4), (-1, 1), (0, 0), (1, 1), (2, 4)",
p:"Nilai kuadrat bilangan selalu tidak negatif. Dengan f(x) = x² diperoleh f(-2)=4, f(-1)=1, f(0)=0, f(1)=1, dan f(2)=4 sehingga titik-titik tersebut benar.",
img:""
},
{
q:"Fungsi f(x) = x + 5 disajikan dalam bentuk tabel dengan domain {0, 1, 2}. Nilai f(x) yang benar adalah ...",
options:["5, 6, 7","6, 7, 8","4, 5, 6","3, 4, 5"],
correct:"5, 6, 7",
p:"Dengan f(x) = x + 5 diperoleh f(0)=5, f(1)=6, dan f(2)=7. Nilai-nilai ini sesuai dengan tabel fungsi.",
img:""
}

];

let currentQuestion=0;
let scores=[0,0,0,0];
let wrongs=[0,0,0,0];
let currentTeam=0;
let answered=new Array(questions.length).fill(false);
let quizFinished=false;

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}}

function showQuestion(){
if(quizFinished) return;

let q=questions[currentQuestion];
let opsi=[...q.options];
shuffle(opsi);

q.correctIndex=opsi.indexOf(q.correct);
q.correctLetter=String.fromCharCode(65+q.correctIndex);

document.getElementById("question").textContent=q.q;
document.getElementById("questionNumber").textContent=
`Soal ${currentQuestion+1} dari ${questions.length}`;

let html="";
opsi.forEach((o,i)=>{
let letter=String.fromCharCode(65+i);
let btnClass=["btnA","btnB","btnC","btnD"][i];
html+=`<button class="optionBtn ${btnClass}"
onclick="checkAnswer('${letter}','${o}',this)">
${letter}. ${o}</button>`;
});
document.getElementById("options").innerHTML=html;
document.getElementById("feedback").textContent="";
closePembahasan();
}

function checkAnswer(letter,text,btn){
if(quizFinished) return;

let q=questions[currentQuestion];
document.querySelectorAll(".optionBtn").forEach(b=>b.disabled=true);

if(text===q.correct){
btn.classList.add("correct");
scores[currentTeam]++;
answered[currentQuestion]=true;
document.getElementById("feedback").textContent="✅ Benar";
}else{
btn.classList.add("wrong");
wrongs[currentTeam]++;
document.getElementById("feedback").textContent="❌ Salah";
}

updateScore();

setTimeout(()=>{
if(answered.every(v=>v)){
endQuiz();
}else nextQuestion();
},800);
}

function nextQuestion(){
let start=currentQuestion;
do{
currentQuestion=(currentQuestion+1)%questions.length;
}while(answered[currentQuestion] && currentQuestion!==start);
showQuestion();
}

function endQuiz(){
quizFinished=true;
clearInterval(timer);
document.getElementById("question").innerHTML="🏁 <b>KUIS SELESAI</b>";
document.getElementById("options").innerHTML="";
document.getElementById("feedback").innerHTML=showWinners();
}

function showWinners(){
let rank=[0,1,2,3].map(i=>({
team:i+1,
score:scores[i]-wrongs[i]
}));
rank.sort((a,b)=>b.score-a.score);

let html="<h2>🏆 Pengumuman Juara</h2>";
rank.forEach((r,i)=>{
html+=`<p>Juara ${i+1}: <b>Regu ${r.team}</b> (Skor ${r.score})</p>`;
});
return html;
}

function updateScore(){
for(let i=0;i<4;i++){
document.getElementById("team"+(i+1)).textContent=
`Regu ${i+1} | Benar: ${scores[i]} | Salah: ${wrongs[i]} | Skor: ${scores[i]-wrongs[i]}`;
}}

function switchTeam(){
document.getElementById("team"+(currentTeam+1)).classList.remove("active");
currentTeam=(currentTeam+1)%4;
document.getElementById("team"+(currentTeam+1)).classList.add("active");
}

function showPembahasan(){
document.getElementById("pembahasanText").textContent=
questions[currentQuestion].p;
document.getElementById("pembahasan").style.display="block";
}

function closePembahasan(){
document.getElementById("pembahasan").style.display="none";
}

let timeLeft=3600;
let timer=setInterval(()=>{
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
if(s<10)s="0"+s;
document.getElementById("timer").textContent=`Waktu: ${m}:${s}`;
timeLeft--;
if(timeLeft<0){
document.getElementById("timer").textContent="⏰ Waktu Habis";
endQuiz();
}},1000);

shuffle(questions);
updateScore();
showQuestion();
</script>

<h3>Dian Wiguna</h3>
</body>
</html>
