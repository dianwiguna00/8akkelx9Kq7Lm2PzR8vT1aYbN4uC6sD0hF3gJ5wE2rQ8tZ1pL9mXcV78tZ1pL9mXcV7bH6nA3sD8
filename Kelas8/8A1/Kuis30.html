<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Matematika</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
margin:0;
text-align:center;
}

.container{
max-width:950px;
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.timer{
font-size:24px;
font-weight:bold;
color:#d9534f;
margin-bottom:10px;
}

.score-board{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.team{
padding:12px;
background:#f0f0f0;
border-radius:10px;
font-size:18px;
}

.active{
background:#c8f7c5;
font-weight:bold;
}

.question{
  font-size:24px;
  text-align:left;
  margin:10px 0;
  white-space: pre-line;
}

.options{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.optionBtn{
padding:15px;
font-size:20px;
border:none;
border-radius:12px;
cursor:pointer;
color:white;
font-weight:bold;
}

.btnA{background:#1E88E5;}
.btnB{background:#43A047;}
.btnC{background:#FB8C00;}
.btnD{background:#8E24AA;}

.correct{background:#2ecc71!important;}
.wrong{background:#e74c3c!important;}

button{
margin:5px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#4CAF50;
color:white;
font-size:16px;
cursor:pointer;
}

.feedback{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.pembahasan{
display:none;
margin-top:15px;
padding:15px;
background:#f9fbff;
border-left:5px solid #2196F3;
text-align:left;
border-radius:10px;
}
.close{
float:right;
cursor:pointer;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>🎮 Kuis Matematika</h1>
<h3>Asesmen Sumatif Semester 1 Matematika</h3>

<div class="timer" id="timer">Waktu: 60:00</div>

<div class="score-board">
<div id="team1" class="team active"></div>
<div id="team2" class="team"></div>
<div id="team3" class="team"></div>
<div id="team4" class="team"></div>
</div>

<div id="questionNumber"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>

<button onclick="nextQuestion()">Soal Berikut</button>
<button onclick="switchTeam()">Ganti Regu</button>
<button onclick="showPembahasan()">📘 Pembahasan</button>

<div id="feedback" class="feedback"></div>

<div id="pembahasan" class="pembahasan">
<span class="close" onclick="closePembahasan()">✖</span>
<b>Pembahasan</b>
<div id="pembahasanText"></div>
</div>
</div>

<script>
let questions=[
{
q:"Pola bilangan: 4, 7, 10, 13, ... Suku ke-15 dari pola tersebut adalah ...",
options:["43","46","49","52"],
correct:"46",
p:"Pola bilangan tersebut merupakan barisan aritmetika dengan suku pertama 4 dan beda 3. Rumus suku ke-n adalah Un = a + (n-1)d = 4 + (15-1)×3 = 4 + 42 = 46. Maka jawaban yang benar adalah 46.",
img:""
},
{
q:"Diberikan relasi: {(2, 4), (3, 6), (4, 8), (5, 10)}. Apakah relasi tersebut merupakan fungsi?",
options:["Ya, karena setiap anggota domain berpasangan tepat satu dengan kodomain","Tidak, karena ada domain yang berpasangan lebih dari satu","Tidak, karena ada kodomain yang berpasangan lebih dari satu","Tidak diketahui"],
correct:"Ya, karena setiap anggota domain berpasangan tepat satu dengan kodomain",
p:"Suatu relasi disebut fungsi jika setiap anggota domain berpasangan tepat satu dengan anggota kodomain. Pada relasi tersebut, setiap domain (2, 3, 4, 5) memiliki tepat satu pasangan, sehingga relasi tersebut adalah fungsi.",
img:""
},
{
q:"Tentukan persamaan garis yang melalui titik (2, 3) dan (4, 7).",
options:["y = 2x - 1","y = x + 1","y = 3x - 3","y = 4x - 5"],
correct:"y = 2x - 1",
p:"Gradien garis adalah m = (7 - 3) / (4 - 2) = 2. Dengan menggunakan rumus titik-gradien: y - 3 = 2(x - 2), diperoleh y = 2x - 1 sebagai persamaan garis.",
img:""
},
{
q:"Harga 2 pensil dan 3 buku adalah Rp27.000. Harga 3 pensil dan 2 buku adalah Rp24.000. Tentukan harga satu pensil dan satu buku.",
options:["Pensil Rp3.000, Buku Rp7.000","Pensil Rp3.600, Buku Rp6.600","Pensil Rp5.000, Buku Rp5.000","Pensil Rp6.000, Buku Rp4.000"],
correct:"Pensil Rp3.600, Buku Rp6.600",
p:"Misalkan x adalah harga satu pensil dan y harga satu buku. Diperoleh SPLDV: 2x + 3y = 27.000 dan 3x + 2y = 24.000. Dengan eliminasi diperoleh x = 3.600 dan y = 6.600.",
img:""
},
{
q:"Sebuah toko menjual barang dengan harga tetap Rp15.000 per unit. Grafik hubungan antara jumlah barang (x) dan total harga (y) adalah ...",
options:["y = 15.000x","y = 15.000 + x","y = x/15.000","y = 15.000 - x"],
correct:"y = 15.000x",
p:"Total harga diperoleh dari harga satuan dikalikan jumlah barang. Karena harga satu unit adalah Rp15.000, maka hubungan antara jumlah barang dan total harga dinyatakan dengan persamaan y = 15.000x.",
img:""
}

];

let currentQuestion=0;
let scores=[0,0,0,0];
let wrongs=[0,0,0,0];
let currentTeam=0;
let answered=new Array(questions.length).fill(false);
let quizFinished=false;

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}}

function showQuestion(){
if(quizFinished) return;

let q=questions[currentQuestion];
let opsi=[...q.options];
shuffle(opsi);

q.correctIndex=opsi.indexOf(q.correct);
q.correctLetter=String.fromCharCode(65+q.correctIndex);

document.getElementById("question").textContent=q.q;
document.getElementById("questionNumber").textContent=
`Soal ${currentQuestion+1} dari ${questions.length}`;

let html="";
opsi.forEach((o,i)=>{
let letter=String.fromCharCode(65+i);
let btnClass=["btnA","btnB","btnC","btnD"][i];
html+=`<button class="optionBtn ${btnClass}"
onclick="checkAnswer('${letter}','${o}',this)">
${letter}. ${o}</button>`;
});
document.getElementById("options").innerHTML=html;
document.getElementById("feedback").textContent="";
closePembahasan();
}

function checkAnswer(letter,text,btn){
if(quizFinished) return;

let q=questions[currentQuestion];
document.querySelectorAll(".optionBtn").forEach(b=>b.disabled=true);

if(text===q.correct){
btn.classList.add("correct");
scores[currentTeam]++;
answered[currentQuestion]=true;
document.getElementById("feedback").textContent="✅ Benar";
}else{
btn.classList.add("wrong");
wrongs[currentTeam]++;
document.getElementById("feedback").textContent="❌ Salah";
}

updateScore();

setTimeout(()=>{
if(answered.every(v=>v)){
endQuiz();
}else nextQuestion();
},800);
}

function nextQuestion(){
let start=currentQuestion;
do{
currentQuestion=(currentQuestion+1)%questions.length;
}while(answered[currentQuestion] && currentQuestion!==start);
showQuestion();
}

function endQuiz(){
quizFinished=true;
clearInterval(timer);
document.getElementById("question").innerHTML="🏁 <b>KUIS SELESAI</b>";
document.getElementById("options").innerHTML="";
document.getElementById("feedback").innerHTML=showWinners();
}

function showWinners(){
let rank=[0,1,2,3].map(i=>({
team:i+1,
score:scores[i]-wrongs[i]
}));
rank.sort((a,b)=>b.score-a.score);

let html="<h2>🏆 Pengumuman Juara</h2>";
rank.forEach((r,i)=>{
html+=`<p>Juara ${i+1}: <b>Regu ${r.team}</b> (Skor ${r.score})</p>`;
});
return html;
}

function updateScore(){
for(let i=0;i<4;i++){
document.getElementById("team"+(i+1)).textContent=
`Regu ${i+1} | Benar: ${scores[i]} | Salah: ${wrongs[i]} | Skor: ${scores[i]-wrongs[i]}`;
}}

function switchTeam(){
document.getElementById("team"+(currentTeam+1)).classList.remove("active");
currentTeam=(currentTeam+1)%4;
document.getElementById("team"+(currentTeam+1)).classList.add("active");
}

function showPembahasan(){
document.getElementById("pembahasanText").textContent=
questions[currentQuestion].p;
document.getElementById("pembahasan").style.display="block";
}

function closePembahasan(){
document.getElementById("pembahasan").style.display="none";
}

let timeLeft=3600;
let timer=setInterval(()=>{
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
if(s<10)s="0"+s;
document.getElementById("timer").textContent=`Waktu: ${m}:${s}`;
timeLeft--;
if(timeLeft<0){
document.getElementById("timer").textContent="⏰ Waktu Habis";
endQuiz();
}},1000);

shuffle(questions);
updateScore();
showQuestion();
</script>

<h3>Dian Wiguna</h3>
</body>
</html>
