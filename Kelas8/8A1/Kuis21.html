<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Matematika</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
margin:0;
text-align:center;
}

.container{
max-width:950px;
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.timer{
font-size:24px;
font-weight:bold;
color:#d9534f;
margin-bottom:10px;
}

.score-board{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.team{
padding:12px;
background:#f0f0f0;
border-radius:10px;
font-size:18px;
}

.active{
background:#c8f7c5;
font-weight:bold;
}

.question{
  font-size:24px;
  text-align:left;
  margin:10px 0;
  white-space: pre-line;
}

.options{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.optionBtn{
padding:15px;
font-size:20px;
border:none;
border-radius:12px;
cursor:pointer;
color:white;
font-weight:bold;
}

.btnA{background:#1E88E5;}
.btnB{background:#43A047;}
.btnC{background:#FB8C00;}
.btnD{background:#8E24AA;}

.correct{background:#2ecc71!important;}
.wrong{background:#e74c3c!important;}

button{
margin:5px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#4CAF50;
color:white;
font-size:16px;
cursor:pointer;
}

.feedback{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.pembahasan{
display:none;
margin-top:15px;
padding:15px;
background:#f9fbff;
border-left:5px solid #2196F3;
text-align:left;
border-radius:10px;
}
.close{
float:right;
cursor:pointer;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>🎮 Kuis Matematika</h1>
<h3>Menafsirkan Solusi SPLDV dalam Konteks Kehidupan Nyata</h3>

<div class="timer" id="timer">Waktu: 60:00</div>

<div class="score-board">
<div id="team1" class="team active"></div>
<div id="team2" class="team"></div>
<div id="team3" class="team"></div>
<div id="team4" class="team"></div>
</div>

<div id="questionNumber"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>

<button onclick="nextQuestion()">Soal Berikut</button>
<button onclick="switchTeam()">Ganti Regu</button>
<button onclick="showPembahasan()">📘 Pembahasan</button>

<div id="feedback" class="feedback"></div>

<div id="pembahasan" class="pembahasan">
<span class="close" onclick="closePembahasan()">✖</span>
<b>Pembahasan</b>
<div id="pembahasanText"></div>
</div>
</div>

<script>
let questions=[
{
q:"Seorang pedagang menjual 3 apel dan 2 jeruk seharga Rp20.000, sedangkan 2 apel dan 4 jeruk seharga Rp22.000. Jika x adalah harga apel dan y adalah harga jeruk, maka solusi SPLDV (x, y) menunjukkan ...",
options:["Jumlah apel dan jeruk","Harga total buah","Harga masing-masing buah","Jumlah uang yang dibayarkan"],
correct:"Harga masing-masing buah",
p:"Pada soal, variabel x didefinisikan sebagai harga apel dan y sebagai harga jeruk. Solusi SPLDV berupa pasangan (x, y) menyatakan nilai kedua variabel tersebut, sehingga maknanya adalah harga masing-masing buah.",
img:""
},
{
q:"Dalam sebuah kelas terdapat 40 siswa. Jumlah siswa laki-laki dua kali jumlah siswa perempuan. Jika x adalah jumlah siswa laki-laki dan y adalah jumlah siswa perempuan, maka solusi SPLDV (x, y) menunjukkan ...",
options:["Jumlah total siswa","Jumlah siswa laki-laki dan perempuan","Rasio siswa laki-laki terhadap perempuan","Jumlah siswa yang hadir"],
correct:"Jumlah siswa laki-laki dan perempuan",
p:"Variabel x menyatakan jumlah siswa laki-laki dan y menyatakan jumlah siswa perempuan. Oleh karena itu, solusi SPLDV (x, y) menunjukkan banyaknya siswa laki-laki dan perempuan di kelas tersebut.",
img:""
},
{
q:"Seorang ibu membeli 5 kg beras dan 2 liter minyak seharga Rp80.000. Temannya membeli 3 kg beras dan 4 liter minyak seharga Rp76.000. Jika x adalah harga beras per kg dan y adalah harga minyak per liter, maka solusi SPLDV (x, y) menunjukkan ...",
options:["Jumlah uang yang dibayarkan","Jumlah barang yang dibeli","Harga masing-masing barang","Total berat dan volume barang"],
correct:"Harga masing-masing barang",
p:"Pada konteks soal, x menyatakan harga beras per kilogram dan y menyatakan harga minyak per liter. Solusi SPLDV memberikan nilai x dan y, yaitu harga masing-masing barang.",
img:""
},
{
q:"Dalam sebuah lomba, total skor dua peserta adalah 180. Skor peserta A dua kali skor peserta B. Jika x adalah skor peserta A dan y adalah skor peserta B, maka solusi SPLDV (x, y) menunjukkan ...",
options:["Jumlah soal yang dijawab","Skor akhir lomba","Skor masing-masing peserta","Waktu pengerjaan soal"],
correct:"Skor masing-masing peserta",
p:"Variabel x dan y masing-masing didefinisikan sebagai skor peserta A dan peserta B. Oleh karena itu, solusi SPLDV (x, y) menunjukkan skor yang diperoleh oleh masing-masing peserta lomba.",
img:""
},
{
q:"Seorang siswa membeli 2 pensil dan 3 buku seharga Rp21.000. Temannya membeli 4 pensil dan 1 buku seharga Rp19.000. Jika x adalah harga pensil dan y adalah harga buku, maka solusi SPLDV (x, y) menunjukkan ...",
options:["Jumlah barang yang dibeli","Harga masing-masing barang","Total harga belanja","Diskon yang diberikan"],
correct:"Harga masing-masing barang",
p:"Variabel x menyatakan harga satu pensil dan y menyatakan harga satu buku. Solusi SPLDV (x, y) memberikan nilai harga masing-masing barang tersebut.",
img:""
}

];

let currentQuestion=0;
let scores=[0,0,0,0];
let wrongs=[0,0,0,0];
let currentTeam=0;
let answered=new Array(questions.length).fill(false);
let quizFinished=false;

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}}

function showQuestion(){
if(quizFinished) return;

let q=questions[currentQuestion];
let opsi=[...q.options];
shuffle(opsi);

q.correctIndex=opsi.indexOf(q.correct);
q.correctLetter=String.fromCharCode(65+q.correctIndex);

document.getElementById("question").textContent=q.q;
document.getElementById("questionNumber").textContent=
`Soal ${currentQuestion+1} dari ${questions.length}`;

let html="";
opsi.forEach((o,i)=>{
let letter=String.fromCharCode(65+i);
let btnClass=["btnA","btnB","btnC","btnD"][i];
html+=`<button class="optionBtn ${btnClass}"
onclick="checkAnswer('${letter}','${o}',this)">
${letter}. ${o}</button>`;
});
document.getElementById("options").innerHTML=html;
document.getElementById("feedback").textContent="";
closePembahasan();
}

function checkAnswer(letter,text,btn){
if(quizFinished) return;

let q=questions[currentQuestion];
document.querySelectorAll(".optionBtn").forEach(b=>b.disabled=true);

if(text===q.correct){
btn.classList.add("correct");
scores[currentTeam]++;
answered[currentQuestion]=true;
document.getElementById("feedback").textContent="✅ Benar";
}else{
btn.classList.add("wrong");
wrongs[currentTeam]++;
document.getElementById("feedback").textContent="❌ Salah";
}

updateScore();

setTimeout(()=>{
if(answered.every(v=>v)){
endQuiz();
}else nextQuestion();
},800);
}

function nextQuestion(){
let start=currentQuestion;
do{
currentQuestion=(currentQuestion+1)%questions.length;
}while(answered[currentQuestion] && currentQuestion!==start);
showQuestion();
}

function endQuiz(){
quizFinished=true;
clearInterval(timer);
document.getElementById("question").innerHTML="🏁 <b>KUIS SELESAI</b>";
document.getElementById("options").innerHTML="";
document.getElementById("feedback").innerHTML=showWinners();
}

function showWinners(){
let rank=[0,1,2,3].map(i=>({
team:i+1,
score:scores[i]-wrongs[i]
}));
rank.sort((a,b)=>b.score-a.score);

let html="<h2>🏆 Pengumuman Juara</h2>";
rank.forEach((r,i)=>{
html+=`<p>Juara ${i+1}: <b>Regu ${r.team}</b> (Skor ${r.score})</p>`;
});
return html;
}

function updateScore(){
for(let i=0;i<4;i++){
document.getElementById("team"+(i+1)).textContent=
`Regu ${i+1} | Benar: ${scores[i]} | Salah: ${wrongs[i]} | Skor: ${scores[i]-wrongs[i]}`;
}}

function switchTeam(){
document.getElementById("team"+(currentTeam+1)).classList.remove("active");
currentTeam=(currentTeam+1)%4;
document.getElementById("team"+(currentTeam+1)).classList.add("active");
}

function showPembahasan(){
document.getElementById("pembahasanText").textContent=
questions[currentQuestion].p;
document.getElementById("pembahasan").style.display="block";
}

function closePembahasan(){
document.getElementById("pembahasan").style.display="none";
}

let timeLeft=3600;
let timer=setInterval(()=>{
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
if(s<10)s="0"+s;
document.getElementById("timer").textContent=`Waktu: ${m}:${s}`;
timeLeft--;
if(timeLeft<0){
document.getElementById("timer").textContent="⏰ Waktu Habis";
endQuiz();
}},1000);

shuffle(questions);
updateScore();
showQuestion();
</script>


</body>
</html>
